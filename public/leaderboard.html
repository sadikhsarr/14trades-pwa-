<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>14 Trades — Road to $1,000,000</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080808;color:#F0F0F0;font-family:'Inter',system-ui,sans-serif;min-height:100vh;padding-bottom:80px}
.header{padding:24px 20px 20px;text-align:center;border-bottom:1px solid #111}
.logo{font-family:'Space Mono',monospace;font-size:22px;font-weight:700;color:#FFD700}
.title{font-size:13px;color:#333;letter-spacing:2px;text-transform:uppercase;margin-top:4px}
.target{font-family:'Space Mono',monospace;font-size:11px;color:#FFD70060;margin-top:2px}
.wrap{max-width:420px;margin:0 auto;padding:20px}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:24px}
.stat{background:#0D0D0D;border:1px solid #141414;border-radius:12px;padding:12px;text-align:center}
.stat-val{font-family:'Space Mono',monospace;font-size:16px;font-weight:700;color:#FFD700;margin-bottom:2px}
.stat-lbl{font-size:8px;color:#2A2A2A;letter-spacing:1px;text-transform:uppercase}
.section-label{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.section-line{flex:1;height:1px;background:#111}
.section-txt{font-size:9px;color:#2A2A2A;letter-spacing:2px;text-transform:uppercase;white-space:nowrap}
.member-card{background:#0D0D0D;border:1px solid #141414;border-radius:14px;padding:14px 16px;margin-bottom:10px;position:relative;overflow:hidden}
.member-card.gold{border-color:#FFD70030;background:linear-gradient(135deg,#0D0B00,#0D0D0D)}
.member-card.silver{border-color:#C0C0C025}
.member-card.bronze{border-color:#CD7F3225}
.rank{font-family:'Space Mono',monospace;font-size:11px;color:#333;font-weight:700;margin-bottom:8px}
.rank.first{color:#FFD700}
.rank.second{color:#C0C0C0}
.rank.third{color:#CD7F32}
.member-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.member-info{display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:9px;background:#1A1A1A;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#FFD700;flex-shrink:0}
.avatar.first{background:linear-gradient(135deg,#C9A84C,#FFD700);color:#000}
.name{font-size:14px;font-weight:700;color:#F0F0F0}
.phase-tag{font-size:9px;color:#444;margin-top:2px}
.balance{font-family:'Space Mono',monospace;font-size:16px;font-weight:700;color:#FFD700;text-align:right}
.balance-sub{font-size:9px;color:#333;text-align:right;margin-top:2px}
.progress-wrap{margin-top:2px}
.progress-bar{height:3px;background:#111;border-radius:2px;overflow:hidden}
.progress-fill{height:100%;border-radius:2px;transition:width .8s ease}
.fill-gold{background:linear-gradient(90deg,#C9A84C,#FFD700)}
.fill-default{background:#2A2A2A}
.prog-labels{display:flex;justify-content:space-between;font-size:8px;color:#1A1A1A;margin-top:3px}
.million-card{background:linear-gradient(135deg,#0A0800,#080800);border:1px solid #FFD70040;border-radius:14px;padding:20px;margin-bottom:10px;text-align:center}
.million-emoji{font-size:32px;margin-bottom:8px}
.million-title{font-size:14px;font-weight:700;color:#FFD700;margin-bottom:4px}
.million-sub{font-size:11px;color:#444}
.cta{position:fixed;bottom:0;left:0;right:0;padding:14px 20px 24px;background:linear-gradient(to top,#080808 70%,transparent)}
.cta-inner{max-width:420px;margin:0 auto}
.cta-btn{display:block;width:100%;background:linear-gradient(135deg,#C9A84C,#FFD700);color:#000;border:none;border-radius:12px;padding:14px;font-size:14px;font-weight:800;text-align:center;text-decoration:none;font-family:inherit}
.loading{text-align:center;padding:40px;color:#1A1A1A;font-size:13px}
@keyframes shine{0%{left:-100%}100%{left:200%}}
</style>
</head>
<body>

<div class="header">
  <div class="logo">14⚡</div>
  <div class="title">Road to $1,000,000</div>
  <div class="target">Objectif final · Or · 14 phases</div>
</div>

<div class="wrap">

  <div class="stats-row">
    <div class="stat">
      <div class="stat-val" id="stat-members">—</div>
      <div class="stat-lbl">Membres</div>
    </div>
    <div class="stat">
      <div class="stat-val" id="stat-phase">—</div>
      <div class="stat-lbl">Phase Max</div>
    </div>
    <div class="stat">
      <div class="stat-val" id="stat-top">—</div>
      <div class="stat-lbl">Capital Max</div>
    </div>
  </div>

  <div class="section-label">
    <div class="section-line"></div>
    <div class="section-txt">Classement</div>
    <div class="section-line"></div>
  </div>

  <div id="leaderboard-feed">
    <div class="loading">Chargement du classement...</div>
  </div>

</div>

<div class="cta">
  <div class="cta-inner">
    <a href="/trial.html" class="cta-btn">⚡ Rejoindre le challenge — 7 jours gratuits</a>
  </div>
</div>

<script>
const SERVER = 'https://14trades-server-production.up.railway.app';
const PHASES = [
  {phase:1,from:200,to:400},{phase:2,from:400,to:800},
  {phase:3,from:800,to:1600},{phase:4,from:1600,to:3200},
  {phase:5,from:3200,to:6400},{phase:6,from:6400,to:12800},
  {phase:7,from:12800,to:25600},{phase:8,from:25600,to:51200},
  {phase:9,from:51200,to:102400},{phase:10,from:102400,to:204800},
  {phase:11,from:204800,to:409600},{phase:12,from:409600,to:819200},
  {phase:13,from:819200,to:1000000},
];

function getPhase(balance) {
  for (let i = PHASES.length - 1; i >= 0; i--) {
    if (balance >= PHASES[i].from) return PHASES[i].phase;
  }
  return 1; // minimum phase 1
}

function getPhaseInfo(balance) {
  const phase = getPhase(balance);
  const p = PHASES[Math.max(0, phase - 1)];
  const prog = p ? Math.max(0, Math.min(100, Math.round((balance - p.from) / (p.to - p.from) * 100))) : 0;
  return { phase, from: p?.from || 200, to: p?.to || 400, prog };
}

function fmt(n) {
  const num = parseFloat(n);
  if (num >= 1000000) return '$' + (num/1000000).toFixed(2) + 'M';
  if (num >= 1000) return '$' + (num/1000).toFixed(1) + 'K';
  return '$' + Math.round(num).toLocaleString('en-US');
}

const medals = ['🥇','🥈','🥉'];
const rankClass = ['first','second','third'];
const cardClass = ['gold','silver','bronze'];

async function loadLeaderboard() {
  try {
    const r = await fetch(SERVER + '/api/leaderboard');
    const d = await r.json();
    // Deduplicate — keep highest balance per name
    const seen = {};
    const members = (d.members || []).filter(m => {
      const key = m.name.trim().toLowerCase();
      if (seen[key] === undefined || parseFloat(m.balance) > parseFloat(seen[key])) {
        seen[key] = parseFloat(m.balance);
        return true;
      }
      return false;
    }).sort((a,b) => parseFloat(b.balance) - parseFloat(a.balance));

    if (!members.length) {
      document.getElementById('leaderboard-feed').innerHTML = 
        '<div class="loading">Aucun membre encore — sois le premier ! ⚡</div>';
      return;
    }

    // Stats
    document.getElementById('stat-members').textContent = members.length + '+';
    const maxPhase = Math.max(...members.map(m => m.phase));
    document.getElementById('stat-phase').textContent = 'P' + maxPhase;
    const topBalance = Math.max(...members.map(m => parseFloat(m.balance)));
    document.getElementById('stat-top').textContent = fmt(topBalance);

    // Leaderboard
    const feed = document.getElementById('leaderboard-feed');
    feed.innerHTML = members.map((m, i) => {
      const balance = parseFloat(m.balance);
      const info = getPhaseInfo(balance);
      const isTop3 = i < 3;
      const isMillion = balance >= 1000000;

      if (isMillion) {
        return `<div class="million-card">
          <div class="million-emoji">🏆</div>
          <div style="font-size:11px;color:#FFD70080;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px">MILLIONNAIRE</div>
          <div class="million-title">${m.name}</div>
          <div class="million-sub">$1,000,000 · Road to $1M complété ⚡</div>
        </div>`;
      }

      return `<div class="member-card ${isTop3 ? cardClass[i] : ''}">
        <div class="rank ${isTop3 ? rankClass[i] : ''}">
          ${isTop3 ? medals[i] : '#' + (i+1)} ${isTop3 ? '' : ''}
        </div>
        <div class="member-row">
          <div class="member-info">
            <div class="avatar ${i===0?'first':''}">${m.name.charAt(0).toUpperCase()}</div>
            <div>
              <div class="name">${m.name}</div>
              <div class="phase-tag">Phase ${info.phase} · ${fmt(info.from)} → ${fmt(info.to)}</div>
              ${m.habit_days > 0 ? `<div style="font-size:9px;color:#2A2A2A;margin-top:2px">🔥 ${m.habit_days} jours</div>` : ''}
            </div>
          </div>
          <div>
            <div class="balance">${fmt(balance)}</div>
            <div class="balance-sub">${info.prog}% phase ${info.phase}</div>
          </div>
        </div>
        <div class="progress-wrap">
          <div class="progress-bar">
            <div class="progress-fill ${i===0?'fill-gold':'fill-default'}" style="width:${info.prog}%"></div>
          </div>
          <div class="prog-labels">
            <span>${fmt(info.from)}</span>
            <span>${fmt(info.to)}</span>
          </div>
        </div>
      </div>`;
    }).join('');

  } catch(e) {
    document.getElementById('leaderboard-feed').innerHTML = 
      '<div class="loading">Erreur de chargement</div>';
  }
}

loadLeaderboard();
// Auto refresh every 60 seconds
setInterval(loadLeaderboard, 60000);
</script>
</body>
</html>
