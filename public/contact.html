<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contacte-moi — 14 Trades Alert</title>
<style>
  :root { box-sizing:border-box; }
  * { box-sizing:inherit; margin:0; padding:0; }
  html, body { height:100%; background:#080808; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
  body { display:flex; align-items:center; justify-content:center; padding:24px; }
  .wrap { max-width:380px; width:100%; text-align:center; }
  .logo { font-family:monospace; font-size:20px; font-weight:700; color:#C9A84C; margin-bottom:6px; }
  .brand { font-size:11px; font-weight:700; letter-spacing:2px; color:#F0F2F8; margin-bottom:36px; }
  h1 { font-size:20px; color:#F0F2F8; margin-bottom:8px; }
  .sub { font-size:13px; color:#888; margin-bottom:36px; }
  .btn { display:flex; align-items:center; gap:14px; background:#0D0D0D; border:1px solid #1A1A1A; border-radius:14px; padding:16px 18px; text-decoration:none; margin-bottom:14px; transition:.2s; }
  .btn:active { transform:scale(.98); }
  .btn.whatsapp { border-color:#00C87A40; }
  .btn.tiktok { border-color:#C9A84C40; }
  .icon { font-size:26px; flex-shrink:0; }
  .label { text-align:left; flex:1; }
  .label .name { font-size:15px; font-weight:700; color:#F0F2F8; }
  .label .desc { font-size:11px; color:#666; margin-top:2px; }
  .arrow { font-size:16px; color:#555; }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">14⚡</div>
  <div class="brand">TRADES ALERT</div>
  <h1>Contacte-moi directement</h1>
  <p class="sub">Choisis ton canal préféré</p>

  <a href="https://wa.me/221788255099" target="_blank" class="btn whatsapp">
    <span class="icon">💬</span>
    <span class="label">
      <div class="name">WhatsApp</div>
      <div class="desc">Réponse la plus rapide</div>
    </span>
    <span class="arrow">→</span>
  </a>

  <a href="https://www.tiktok.com/@14_trades" target="_blank" class="btn tiktok">
    <span class="icon">🎵</span>
    <span class="label">
      <div class="name">TikTok</div>
      <div class="desc">Suis mes lives et analyses</div>
    </span>
    <span class="arrow">→</span>
  </a>
</div>
</body>
</html>
