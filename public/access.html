<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#080808">
  <title>14 Trades — Accès</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;background:#080808;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
    body{display:flex;align-items:center;justify-content:center;padding:32px 20px}
    .box{width:100%;max-width:340px}
    .logo{text-align:center;margin-bottom:36px}
    .logo-mark{font-family:monospace;font-size:32px;font-weight:700;color:#C9A84C}
    .logo-sub{font-size:9px;letter-spacing:3px;color:#2A2A2A;text-transform:uppercase;margin-top:4px}
    label{display:block;font-size:11px;font-weight:600;color:#444;letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px}
    input{width:100%;background:#0D0D0D;border:1px solid #1A1A1A;border-radius:12px;padding:14px 16px;font-size:15px;color:#F0F0F0;outline:none;font-family:inherit}
    input.code{font-family:monospace;font-size:18px;letter-spacing:4px;text-align:center;text-transform:uppercase}
    .field{margin-bottom:16px}
    .err{font-size:12px;text-align:center;min-height:18px;margin:8px 0;color:#FF3B4E}
    .info{color:#C9A84C}
    .btn{width:100%;background:linear-gradient(135deg,#C9A84C,#FFD700);color:#000;border:none;border-radius:12px;padding:16px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;margin-top:4px}
    .btn:disabled{opacity:.6;cursor:not-allowed}
    .back{display:block;text-align:center;margin-top:16px;font-size:13px;color:#333;cursor:pointer;background:none;border:none;font-family:inherit;width:100%}
  </style>
</head>
<body>
<div class="box">
  <div class="logo">
    <div class="logo-mark">14⚡</div>
    <div class="logo-sub">TRADES ALERT</div>
  </div>
  <div class="field">
    <label>Email</label>
    <input id="email" type="email" placeholder="ton@email.com" autocomplete="email">
  </div>
  <div class="field">
    <label>Code d'accès</label>
    <input id="code" class="code" type="text" placeholder="XXXX-XXXX" maxlength="9" autocomplete="off" autocorrect="off" autocapitalize="characters">
  </div>
  <div class="err" id="err"></div>
  <button class="btn" id="btn" onclick="login()">Accéder ⚡</button>
  <button class="back" onclick="window.location.href='/'">← Retour</button>
</div>

<script>
var SERVER = 'https://14trades-server-production.up.railway.app';

// Wake server immediately when page loads — so it's ready when user taps login
(function wakeServer() {
  fetch(SERVER + '/api/stats', { method: 'GET' }).catch(function() {
    // Try again after 5s
    setTimeout(function() {
      fetch(SERVER + '/api/stats', { method: 'GET' }).catch(function(){});
    }, 5000);
  });
})();

var savedEmail = localStorage.getItem('14t_email');
if (savedEmail) document.getElementById('email').value = savedEmail;

document.getElementById('code').addEventListener('input', function() {
  var v = this.value.replace(/[^A-Z0-9]/gi,'').toUpperCase();
  if (v.length > 4) v = v.slice(0,4)+'-'+v.slice(4,8);
  this.value = v;
});
document.getElementById('code').addEventListener('keydown', function(e){ if(e.key==='Enter') login(); });
document.getElementById('email').addEventListener('keydown', function(e){ if(e.key==='Enter') document.getElementById('code').focus(); });

// Try fetch with retries — Railway can take up to 30s to wake
async function fetchWithRetry(url, opts, maxTries) {
  var tries = maxTries || 3;
  var lastErr;
  for (var i = 0; i < tries; i++) {
    try {
      var controller = new AbortController();
      var timer = setTimeout(function(){ controller.abort(); }, 40000);
      var res = await fetch(url, Object.assign({}, opts, { signal: controller.signal }));
      clearTimeout(timer);
      return res;
    } catch(e) {
      lastErr = e;
      if (i < tries - 1) {
        // Show wake-up message on first failure
        document.getElementById('err').className = 'err info';
        document.getElementById('err').textContent = 'Connexion au serveur... (' + (i+2) + '/3)';
        await new Promise(function(r){ setTimeout(r, 3000); });
      }
    }
  }
  throw lastErr;
}

async function login() {
  var email = document.getElementById('email').value.trim().toLowerCase();
  var code  = document.getElementById('code').value.trim().toUpperCase();
  var btn   = document.getElementById('btn');
  var err   = document.getElementById('err');

  err.className = 'err';
  err.textContent = '';

  if (!email || !email.includes('@')) { err.textContent = 'Entre ton email'; return; }
  if (!code || code.replace('-','').length < 6) { err.textContent = 'Entre ton code (XXXX-XXXX)'; return; }

  btn.disabled = true;
  btn.textContent = 'Connexion...';

  try {
    var deviceId = localStorage.getItem('14t_device_id');
    if (!deviceId) {
      deviceId = 'dev_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
      localStorage.setItem('14t_device_id', deviceId);
    }

    var res = await fetchWithRetry(SERVER+'/api/activate', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({email:email, code:code, deviceId:deviceId})
    }, 4);

    // Handle rate limit
    if (res.status === 429) {
      err.className = 'err';
      err.textContent = 'Trop de tentatives — attends 1 heure et réessaie';
      btn.disabled = false;
      btn.textContent = 'Accéder ⚡';
      return;
    }

    var d = await res.json();

    if (d.ok) {
      var exp = d.expiresAt ? new Date(d.expiresAt).getTime() : 0;
      if (!exp || exp < Date.now()) exp = Date.now() + 30*24*60*60*1000;
      localStorage.setItem('14t_access',     code);
      localStorage.setItem('14t_email',      email);
      localStorage.setItem('14t_access_exp', String(exp));
      localStorage.setItem('14t_join',       d.joinDate || new Date().toISOString());
      err.className = 'err info';
      err.textContent = '';
      btn.textContent = '✅ Bienvenue!';
      setTimeout(function(){ window.location.href = '/?boot=1'; }, 800);
    } else {
      var msgs = {
        invalid: 'Code invalide — vérifie et réessaie',
        used:    'Code déjà utilisé sur un autre appareil',
        expired: 'Code expiré — contacte Sadikh'
      };
      err.className = 'err';
      err.textContent = msgs[d.reason] || 'Erreur — réessaie';
      btn.disabled = false;
      btn.textContent = 'Accéder ⚡';
    }
  } catch(e) {
    err.className = 'err';
    err.textContent = 'Serveur inaccessible — réessaie dans 30 secondes';
    btn.disabled = false;
    btn.textContent = 'Accéder ⚡';
  }
}
</script>
</body>
</html>
