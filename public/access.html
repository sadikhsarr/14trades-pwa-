<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#080808">
  <title>14 Trades — Accès</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;background:#080808;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
    body{display:flex;align-items:center;justify-content:center;padding:32px 20px}
    .box{width:100%;max-width:340px}
    .logo{text-align:center;margin-bottom:36px}
    .logo-mark{font-family:monospace;font-size:32px;font-weight:700;color:#C9A84C}
    .logo-sub{font-size:9px;letter-spacing:3px;color:#2A2A2A;text-transform:uppercase;margin-top:4px}
    label{display:block;font-size:11px;font-weight:600;color:#444;letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px}
    input{width:100%;background:#0D0D0D;border:1px solid #1A1A1A;border-radius:12px;padding:14px 16px;font-size:15px;color:#F0F0F0;outline:none;font-family:inherit}
    input.code{font-family:monospace;font-size:18px;letter-spacing:4px;text-align:center;text-transform:uppercase}
    .field{margin-bottom:16px}
    .msg{font-size:12px;text-align:center;min-height:18px;margin:8px 0}
    .err{color:#FF3B4E}
    .ok{color:#00C87A}
    .info{color:#C9A84C}
    .btn{width:100%;background:linear-gradient(135deg,#C9A84C,#FFD700);color:#000;border:none;border-radius:12px;padding:16px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;margin-top:4px}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .back{display:block;text-align:center;margin-top:16px;font-size:13px;color:#333;cursor:pointer;background:none;border:none;font-family:inherit;width:100%}
  </style>
</head>
<body>
<div class="box">
  <div class="logo">
    <div class="logo-mark">14⚡</div>
    <div class="logo-sub">TRADES ALERT</div>
  </div>
  <div class="field">
    <label>Email</label>
    <input id="em" type="email" placeholder="ton@email.com" autocomplete="email">
  </div>
  <div class="field">
    <label>Code d'accès</label>
    <input id="cd" class="code" type="text" placeholder="XXXX-XXXX" maxlength="9" autocomplete="off" autocorrect="off" autocapitalize="characters">
  </div>
  <div class="msg err" id="msg"></div>
  <button class="btn" id="btn" onclick="go()">Accéder ⚡</button>
  <button class="back" onclick="location.href='/'">← Retour</button>
</div>

<script>
var S = 'https://14trades-server-production.up.railway.app';

// Pre-fill email
var e0 = localStorage.getItem('14t_email');
if (e0) document.getElementById('em').value = e0;

// Format code XXXX-XXXX
document.getElementById('cd').addEventListener('input', function() {
  var v = this.value.replace(/[^A-Z0-9]/gi,'').toUpperCase().slice(0,8);
  this.value = v.length > 4 ? v.slice(0,4)+'-'+v.slice(4) : v;
});
document.getElementById('cd').addEventListener('keydown',function(e){if(e.key==='Enter')go();});
document.getElementById('em').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('cd').focus();});

// Wake server on load
fetch(S+'/api/stats').catch(function(){});

function show(txt, cls) {
  var el = document.getElementById('msg');
  el.textContent = txt;
  el.className = 'msg ' + (cls||'err');
}

async function go() {
  var email = document.getElementById('em').value.trim().toLowerCase();
  var code  = document.getElementById('cd').value.trim().toUpperCase();
  var btn   = document.getElementById('btn');
  show('');

  if (!email || !email.includes('@')) { show('Entre ton email'); return; }
  if (code.replace('-','').length < 6) { show('Entre ton code (XXXX-XXXX)'); return; }

  btn.disabled = true;
  btn.textContent = 'Connexion...';

  var did = localStorage.getItem('14t_device_id');
  if (!did) { did='dev_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); localStorage.setItem('14t_device_id',did); }

  // Try up to 3 times — Railway can be slow to wake
  for (var attempt = 1; attempt <= 3; attempt++) {
    try {
      if (attempt > 1) {
        show('Tentative '+attempt+'/3...', 'info');
        await new Promise(function(r){setTimeout(r,4000);});
      }

      var ctrl = new AbortController();
      var t = setTimeout(function(){ctrl.abort();}, 30000);

      var res = await fetch(S+'/api/activate', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({email:email, code:code, deviceId:did}),
        signal: ctrl.signal
      });
      clearTimeout(t);

      if (res.status === 429) {
        show('Trop de tentatives — attends 1h');
        btn.disabled=false; btn.textContent='Accéder ⚡';
        return;
      }

      var d = await res.json();

      if (d.ok) {
        // Save with 30-day expiry as clean string
        var exp = (d.expiresAt && new Date(d.expiresAt).getTime() > Date.now())
                  ? new Date(d.expiresAt).getTime()
                  : Date.now() + 30*24*60*60*1000;

        localStorage.setItem('14t_access',     code);
        localStorage.setItem('14t_email',      email);
        localStorage.setItem('14t_access_exp', String(exp));
        localStorage.setItem('14t_join',       d.joinDate || new Date().toISOString());
        // Mark as just-logged-in so app.js boots directly
        localStorage.setItem('14t_just_logged_in', String(Date.now()));

        show('✅ Bienvenue!', 'ok');
        btn.textContent = '✅';

        // Use replace so back button doesn't return to access.html
        setTimeout(function(){ location.replace('/'); }, 600);
        return;
      }

      // Server returned an error
      var msgs = {
        invalid: 'Code invalide — vérifie le code',
        used:    'Code déjà utilisé sur un autre appareil',
        expired: 'Code expiré — contacte Sadikh'
      };
      show(msgs[d.reason] || 'Code invalide');
      btn.disabled=false; btn.textContent='Accéder ⚡';
      return;

    } catch(e) {
      if (attempt === 3) {
        show('Serveur lent — attends 10s et réessaie');
        btn.disabled=false; btn.textContent='Accéder ⚡';
      }
      // else loop continues with next attempt
    }
  }
}
</script>
</body>
</html>
