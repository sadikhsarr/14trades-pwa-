<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="14 Trades">
<meta name="theme-color" content="#C9A84C">
<title>14 Trades Alert</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({ appId: "534e2f6f-66fe-4d3d-904f-e86e603b904b" });
  });
</script>
</head>
<body>

<!-- PUBLIC BROADCAST SCREEN — visible before login -->
<div id="public-screen" style="display:none;position:fixed;inset:0;z-index:500;background:#080808;overflow-y:auto;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased">
  <div style="max-width:420px;margin:0 auto;padding:28px 20px 120px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:32px">
      <div>
        <div style="font-family:'Space Mono',monospace;font-size:24px;font-weight:700;color:#FFD700;line-height:1">14⚡</div>
        <div style="font-size:9px;letter-spacing:3px;color:#444;text-transform:uppercase;margin-top:2px">TRADES ALERT</div>
      </div>
      <button onclick="showAccessScreen()" style="background:transparent;border:1px solid #2A2A2A;border-radius:9px;padding:8px 16px;font-size:12px;font-weight:600;color:#888;cursor:pointer;font-family:'Inter',sans-serif">
        Se connecter
      </button>
    </div>
    <div style="display:inline-flex;align-items:center;gap:7px;background:#0F0F0F;border:1px solid #1A1A1A;border-radius:40px;padding:5px 14px;margin-bottom:16px">
      <div style="width:6px;height:6px;border-radius:50%;background:#00C87A;animation:pulse 2s infinite"></div>
      <span style="font-size:11px;color:#555;letter-spacing:.5px">SIGNAUX LIVE</span>
    </div>
    <div style="font-size:28px;font-weight:700;letter-spacing:-1px;line-height:1.1;margin-bottom:8px;color:#F0F0F0">
      Moi je fais le travail.<br>
      <span style="color:#FFD700">Toi tu exécutes.</span>
    </div>
    <div style="font-size:13px;color:#444;line-height:1.7;margin-bottom:28px">Signaux haute probabilité. Push instantané. Aucune analyse requise.</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:24px">
      <div style="background:#0D0D0D;border:1px solid #1A1A1A;border-radius:12px;padding:14px;text-align:center">
        <div style="font-family:'Space Mono',monospace;font-size:18px;font-weight:700;color:#00C87A;margin-bottom:3px" id="pub-winrate">83%</div>
        <div style="font-size:9px;color:#333;letter-spacing:.8px;text-transform:uppercase">Win Rate</div>
      </div>
      <div style="background:#0D0D0D;border:1px solid #1A1A1A;border-radius:12px;padding:14px;text-align:center">
        <div style="font-family:'Space Mono',monospace;font-size:18px;font-weight:700;color:#FFD700;margin-bottom:3px" id="pub-signals">0+</div>
        <div style="font-size:9px;color:#333;letter-spacing:.8px;text-transform:uppercase">Signaux</div>
      </div>
      <div style="background:#0D0D0D;border:1px solid #1A1A1A;border-radius:12px;padding:14px;text-align:center">
        <div style="font-family:'Space Mono',monospace;font-size:18px;font-weight:700;color:#F0F0F0;margin-bottom:3px" id="pub-members">150+</div>
        <div style="font-size:9px;color:#333;letter-spacing:.8px;text-transform:uppercase">Membres</div>
      </div>
    </div>
    <div style="font-size:10px;color:#444;letter-spacing:2px;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:8px">
      <div style="flex:1;height:1px;background:#111"></div>
      MISES À JOUR
      <div style="flex:1;height:1px;background:#111"></div>
    </div>
    <div id="pub-broadcasts">
      <div style="text-align:center;padding:32px;color:#222;font-size:12px">Chargement...</div>
    </div>
  </div>
  <div style="position:fixed;bottom:0;left:0;right:0;padding:16px 20px 28px;background:linear-gradient(to top,#080808 70%,transparent)">
    <a href="/trial.html" style="display:block;width:100%;max-width:420px;margin:0 auto;background:linear-gradient(135deg,#C9A84C,#FFD700);color:#000;border:none;border-radius:12px;padding:15px;font-size:15px;font-weight:800;text-align:center;text-decoration:none;font-family:'Inter',sans-serif;letter-spacing:-.3px">
      ⚡ Essai gratuit 7 jours
    </a>
    <div style="text-align:center;font-size:11px;color:#2A2A2A;margin-top:8px">Aucune carte bancaire · Accès immédiat</div>
  </div>
</div>

<div id="access-screen" style="display:none"></div>

<div class="phone" id="main-app">
  <div class="header">
    <div class="logo-col">
      <div class="logo-row"><span class="logo-num">14</span><span class="logo-bolt">⚡</span></div>
      <div class="logo-trades">TRADES</div>
      <div class="logo-sub">ALERT</div>
    </div>
    <div class="header-right">
      <div id="member-since" class="member-since"></div>
      <button class="icon-btn" id="notif-btn" onclick="toggleNotifications()">
        <i class="ti ti-bell"></i>
        <span class="badge" id="notif-badge" style="display:none">!</span>
      </button>
    </div>
  </div>

  <div id="main-content">
    <div id="signals-tab" class="tab-content active"></div>
    <div id="history-tab" class="tab-content"></div>
    <div id="stats-tab" class="tab-content"></div>
    <div id="settings-tab" class="tab-content"></div>
  </div>

  <div class="bottom-nav">
    <button class="bnav-btn active" onclick="switchTab('signals',this)">
      <i class="ti ti-bolt"></i><span>Signaux</span>
    </button>
    <button class="bnav-btn" onclick="switchTab('history',this)">
      <i class="ti ti-history"></i><span>Historique</span>
    </button>
    <button class="bnav-btn" onclick="switchTab('stats',this)">
      <i class="ti ti-chart-bar"></i><span>Stats</span>
    </button>
    <button class="bnav-btn" onclick="switchTab('settings',this)">
      <i class="ti ti-settings"></i><span>Réglages</span>
    </button>
  </div>
</div>

<style>
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
</style>

<script src="/app.js"></script>
</body>
</html>
